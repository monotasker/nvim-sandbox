name: Bug report
description: Something is broken in the image, seed, or consumer contract
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues, email per SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, compose snippet, and relevant env (no secrets).
      placeholder: |
        1. docker compose build
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag, commit SHA, or `main` @ date
      placeholder: v0.1.0
  - type: dropdown
    id: platform
    attributes:
      label: Host platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Windows / WSL2
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets. Prefer `docker compose logs editor` snippets.
      render: shell
